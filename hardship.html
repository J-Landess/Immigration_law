<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Assistance Request</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <a href="index.html"><img class="logo-full" src="images/logo-full.png" alt=""></a>
        </header>
        <h1>Financial assistance inquiry</h1>
        <p class="section-lead">Optional. We review requests individually. Submission does not guarantee reduced fees or pro bono services.</p>
        <div class="card">
            <form action="https://formspree.io/f/meevoldo" method="POST">
                <input type="hidden" name="_subject" value="Financial Assistance Inquiry">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="summary">Brief summary of need (avoid SSN / A-number)</label>
                    <textarea id="summary" name="summary" required maxlength="800"></textarea>
                </div>
                <div class="form-group">
                    <label for="household">Household size (optional)</label>
                    <input type="number" id="household" name="household" min="1" max="20">
                </div>
                <p class="disclosure-box">Do not attach tax returns here unless the firm provides a secure upload method.</p>
                <button type="submit" class="btn">Submit request</button>
            </form>
        </div>
        <p><a href="about-us.html">About us</a></p>
    </div>
</body>
</html>
