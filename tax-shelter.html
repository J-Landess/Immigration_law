<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Tax Shelter &amp; Tax Forgiveness - Justin Landess</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/site-nav.js"></script>
</head>
<body>
    <div id="lang-selector">
        <button type="button" data-lang="en" onclick="setLanguage('en')">English</button>
        <button type="button" data-lang="es" onclick="setLanguage('es')">Español</button>
    </div>

    <div class="container">
        <header class="site-header">
            <a href="index.html" aria-label="Home">
                <img class="logo-full" src="images/logo-full.png" width="819" height="545" alt="Tax and Immigration Lawyer — Las Vegas, NV">
            </a>
        </header>
        <nav class="site-nav" id="siteNav"></nav>
        <h1 id="pageHeading"></h1>
        <p id="lead"></p>

        <div class="card">
            <h2 id="infoTitle"></h2>
            <ul id="infoList"></ul>
        </div>

        <p id="ctaText"></p>
        <a class="btn" id="requestBtn" href="intake.html?topic=tax-shelter"></a>
        <a class="btn btn-secondary" id="homeBtn" href="tax-services.html"></a>
        <a class="btn btn-secondary" href="retain.html">Secure an attorney now</a>

        <footer id="footer"></footer>
        <div id="siteFooter"></div>
    </div>

    <script>
        const translations = {
            en: {
                pageTitle: 'Instant Tax Shelter & Tax Forgiveness - Justin Landess',
                navHome: 'Home',
                navAbout: 'About Us',
                navWhatWeDo: 'What We Do',
                navTax: 'Tax Relief',
                pageHeading: 'Worried about the IRS?',
                lead: 'Ask about our Instant Tax Shelter and tax forgiveness information. We help you understand relief programs, payment options, and steps to address IRS debt—with a confidential, no-obligation conversation.',
                infoTitle: 'What we can discuss',
                infoItems: [
                    'Instant Tax Shelter strategies tailored to your situation',
                    'Tax forgiveness and settlement program eligibility',
                    'Liens, levies, and collection actions',
                    'Payment plans and compliance planning',
                    'How tax issues may interact with your immigration goals'
                ],
                ctaText: 'Ready to learn more? Submit the short form and our team will contact you within 24 hours.',
                requestBtn: '📋 REQUEST TAX RELIEF INFORMATION',
                homeBtn: 'Immigration services',
                footer: '© 2026 Justin Landess Immigration Law Group. All rights reserved.',
                footerDisclaimer: 'This page is for general information only and is not tax or legal advice. Outcomes depend on your facts and applicable law.'
            },
            es: {
                pageTitle: 'Refugio Fiscal Instantáneo y Perdón de Impuestos - Justin Landess',
                navHome: 'Inicio',
                navAbout: 'Quiénes Somos',
                navWhatWeDo: 'Qué Hacemos',
                navTax: 'Alivio Fiscal',
                pageHeading: '¿Preocupado por el IRS?',
                lead: 'Pregunte sobre nuestro Refugio Fiscal Instantáneo e información sobre perdón de impuestos. Le ayudamos a entender programas de alivio, opciones de pago y pasos para abordar deudas con el IRS—con una conversación confidencial y sin obligación.',
                infoTitle: 'De qué podemos hablar',
                infoItems: [
                    'Estrategias de Refugio Fiscal Instantáneo adaptadas a su situación',
                    'Elegibilidad para programas de perdón y acuerdos fiscales',
                    'Gravámenes, embargos y acciones de cobro',
                    'Planes de pago y planificación de cumplimiento',
                    'Cómo los asuntos fiscales pueden relacionarse con sus metas de inmigración'
                ],
                ctaText: '¿Listo para saber más? Envíe el formulario breve y nuestro equipo se comunicará con usted dentro de 24 horas.',
                requestBtn: '📋 SOLICITAR INFORMACIÓN DE ALIVIO FISCAL',
                homeBtn: 'Servicios de inmigración',
                footer: '© 2026 Grupo de Ley de Inmigración Justin Landess. Todos los derechos reservados.',
                footerDisclaimer: 'Esta página es solo información general y no constituye asesoramiento fiscal o legal. Los resultados dependen de sus hechos y la ley aplicable.'
            }
        };

        function setLanguage(language) {
            localStorage.setItem('preferredLanguage', language);
            const t = translations[language];
            document.documentElement.lang = language;
            document.title = t.pageTitle;
            renderSiteNav('tax');
            renderSiteFooter(`<p>${t.footer}</p><p>${t.footerDisclaimer}</p>`);
            document.getElementById('pageHeading').textContent = t.pageHeading;
            document.getElementById('lead').textContent = t.lead;
            document.getElementById('infoTitle').textContent = t.infoTitle;
            document.getElementById('infoList').innerHTML = t.infoItems.map(item => `<li>${item}</li>`).join('');
            document.getElementById('ctaText').textContent = t.ctaText;
            document.getElementById('requestBtn').textContent = t.requestBtn;
            document.getElementById('homeBtn').textContent = t.homeBtn;
            document.getElementById('footer').innerHTML = `<p>${t.footer}</p><p>${t.footerDisclaimer}</p>`;
            document.querySelectorAll('#lang-selector button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === language);
            });
        }

        function initLanguage() {
            const userLang = navigator.language || navigator.userLanguage;
            const lang = localStorage.getItem('preferredLanguage') || (userLang.startsWith('es') ? 'es' : 'en');
            setLanguage(lang);
        }

        window.addEventListener('DOMContentLoaded', initLanguage);
    </script>
</body>
</html>
