        function setLanguage(language) {
            localStorage.setItem('preferredLanguage', language);
            translatePage(language);
            updateButtons(language);
        }

        function updateButtons(language) {
            const buttons = document.querySelectorAll('#lang-selector button');
            buttons.forEach(btn => btn.classList.remove('active'));
            document.querySelector(`#lang-selector button[data-lang="${language}"]`).classList.add('active');
        }

        function translatePage(language) {
            const t = translations[language];
            
            document.documentElement.lang = language;
            document.title = t.pageTitle;
            renderSiteNav('home', t.nav);
            renderSiteFooter(`<p>${t.footer}</p><p>${t.footerDisclaimer}</p>`);
            document.getElementById('mainHeading').textContent = t.mainHeading;
            document.getElementById('subheading').textContent = t.subheading;
            document.getElementById('intro1').textContent = t.intro1;
            document.getElementById('intro2').textContent = t.intro2;
            document.getElementById('privacyBannerTitle').textContent = t.privacyBannerTitle;
            document.getElementById('privacyBannerText').textContent = t.privacyBannerText;
            document.getElementById('pathFreeTitle').textContent = t.pathFreeTitle;
            document.getElementById('pathFreeText').textContent = t.pathFreeText;
            document.getElementById('pathFreeBtn').textContent = t.pathFreeBtn;
            document.getElementById('pathPaidTitle').textContent = t.pathPaidTitle;
            document.getElementById('pathPaidText').textContent = t.pathPaidText;
            document.getElementById('pathPaidBtn').textContent = t.pathPaidBtn;
            document.getElementById('consultationBtn').textContent = t.consultationBtn;
            document.getElementById('contactBtn').textContent = t.contactBtn;
            document.getElementById('taxIrsHeading').textContent = t.taxIrsHeading;
            document.getElementById('taxIrsText').textContent = t.taxIrsText;
            document.getElementById('taxIrsBtn').textContent = t.taxIrsBtn;

            document.getElementById('exploreAbout').textContent = t.exploreAbout;

            document.getElementById('trackRecord1').textContent = t.trackRecord1;
            document.getElementById('trackRecord2').textContent = t.trackRecord2;

        function initLanguage() {
            const userLang = navigator.language || navigator.userLanguage;
            const lang = localStorage.getItem('preferredLanguage') || (userLang.startsWith('es') ? 'es' : 'en');
            setLanguage(lang);
        }
