        function setLanguage(language) {
            localStorage.setItem('preferredLanguage', language);
            const t = translations[language];
            document.documentElement.lang = language;
            document.title = t.pageTitle;
            renderSiteNav('about', t.nav);
            renderSiteFooter(`<p>${t.footer}</p><p class="muted">${t.footerDisclaimer}</p>`);

            document.getElementById('pageHeading').textContent = t.pageHeading;
            document.getElementById('lead').textContent = t.lead;
            document.getElementById('privacyBannerTitle').textContent = t.privacyBannerTitle;
            document.getElementById('privacyBannerText').textContent = t.privacyBannerText;
            document.getElementById('pathFreeTitle').textContent = t.pathFreeTitle;
            document.getElementById('pathFreeText').textContent = t.pathFreeText;
            document.getElementById('pathFreeBtn').textContent = t.pathFreeBtn;
            document.getElementById('pathPaidTitle').textContent = t.pathPaidTitle;
            document.getElementById('pathPaidText').textContent = t.pathPaidText;
            document.getElementById('pathPaidBtn').textContent = t.pathPaidBtn;

            document.getElementById('photoGrid').innerHTML = PHOTOS.map(photo => `
                <figure class="photo-card">
                    <img src="${photo.src}" class="${photo.imgClass}" alt="${t[photo.captionKey]}" loading="lazy">
                    <figcaption>${t[photo.captionKey]}</figcaption>
                </figure>
            `).join('');

            ['privacyTitle','privacyP1','privacyP2','privacyDisclosure','approachTitle','approachP1','approachP2',
             'accessTitle','accessP1','accessP2','credentialsTitle','credentialsP1','credentialsNote','hardshipBtn'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = t[id];
            });
            document.getElementById('privacyList').innerHTML = t.privacyList.map(i => `<li>${i}</li>`).join('');
            document.getElementById('credentialsList').innerHTML = t.credentialsList.map(i => `<li>${i}</li>`).join('');
            document.getElementById('footer').innerHTML = `<p>${t.footer}</p><p>${t.footerDisclaimer}</p>`;

            document.querySelectorAll('#lang-selector button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === language);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('preferredLanguage') || (navigator.language.startsWith('es') ? 'es' : 'en');
            setLanguage(lang);
        });
    </script>
</body>
</html>
