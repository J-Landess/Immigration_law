<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Justin Landess Immigration Law</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .photo-card img.portrait { object-fit: contain; background: var(--mx-green-dark); height: 260px; }
    </style>
</head>
<body>
    <div id="lang-selector">
        <button type="button" data-lang="en" onclick="setLanguage('en')">English</button>
        <button type="button" data-lang="es" onclick="setLanguage('es')">Español</button>
    </div>

    <div class="container">
        <header class="site-header">
            <a href="index.html" aria-label="Home">
                <img class="logo-full" src="images/logo-full.png" width="819" height="545" alt="Tax and Immigration Lawyer — Las Vegas, NV">
            </a>
        </header>
        <nav class="site-nav" id="siteNav"></nav>

        <h1 id="pageHeading"></h1>
        <p id="lead"></p>

        <div class="photo-grid" id="photoGrid"></div>

        <div class="card">
            <h2 id="missionTitle"></h2>
            <p id="missionText"></p>
            <ul id="valuesList"></ul>
        </div>

        <div class="card">
            <h2 id="communityTitle"></h2>
            <p id="communityText"></p>
        </div>

        <a class="btn" id="consultBtn" href="intake.html"></a>
        <a class="btn btn-secondary" id="whatWeDoBtn" href="what-we-do.html"></a>

        <footer id="footer"></footer>
    </div>

    <script>
        const PHOTOS = [
            {
                src: 'images/logo-attorney-portrait.png',
                captionKey: 'photoAttorney',
                imgClass: 'portrait'
            },
            {
                src: 'images/logo-legal-symbols.png',
                captionKey: 'photoLegal',
                imgClass: ''
            },
            {
                src: 'images/logo-vegas-skyline.png',
                captionKey: 'photoVegas',
                imgClass: ''
            }
        ];

        const translations = {
            en: {
                pageTitle: 'About Us - Justin Landess Immigration Law',
                navHome: 'Home',
                navAbout: 'About Us',
                navWhatWeDo: 'What We Do',
                navTax: 'Tax Relief',
                pageHeading: 'About Us',
                lead: 'Justin Landess Immigration Law Group is rooted in Las Vegas and greater Nevada. We serve working families, professionals, and individuals who need clear guidance on immigration—and related tax stress—without jargon or runaround.',
                photoAttorney: 'Justin Landess — tax and immigration counsel serving Las Vegas and Nevada.',
                photoLegal: 'Immigration, tax, and federal compliance — advocacy when the stakes are highest.',
                photoVegas: 'Las Vegas skyline — proud to serve Southern Nevada\'s working families.',
                missionTitle: 'Our mission',
                missionText: 'For more than four decades, our practice has combined courtroom experience with a practical, compassionate approach. We explain your options in plain language, respect your time and budget, and fight for outcomes that keep families together.',
                valuesItems: [
                    'Integrity and transparent fees',
                    'Respect for every client\'s story',
                    'Deep knowledge of federal immigration process',
                    'Local roots — UNLV Law, Nevada courts, and community ties'
                ],
                communityTitle: 'Serving Las Vegas & Nevada',
                communityText: 'From the Strip to suburban neighborhoods and rural counties, we understand the mix of cultures and industries that make Nevada strong. Whether you work in hospitality, construction, healthcare, or run your own business, you deserve a legal team that listens.',
                consultBtn: '📋 FREE CONSULTATION',
                whatWeDoBtn: 'See what we do',
                footer: '© 2026 Justin Landess Immigration Law Group. All rights reserved.',
                footerDisclaimer: 'Attorney Advertising. Results not guaranteed.'
            },
            es: {
                pageTitle: 'Quiénes Somos - Justin Landess',
                navHome: 'Inicio',
                navAbout: 'Quiénes Somos',
                navWhatWeDo: 'Qué Hacemos',
                navTax: 'Alivio Fiscal',
                pageHeading: 'Quiénes Somos',
                lead: 'El Grupo de Ley de Inmigración Justin Landess tiene sus raíces en Las Vegas y el resto de Nevada. Servimos a familias trabajadoras, profesionales e individuos que necesitan orientación clara sobre inmigración—y estrés fiscal relacionado—sin tecnicismos ni demoras.',
                photoAttorney: 'Justin Landess — asesoría fiscal y de inmigración en Las Vegas y Nevada.',
                photoLegal: 'Inmigración, impuestos y cumplimiento federal — defensa cuando más importa.',
                photoVegas: 'Horizonte de Las Vegas — orgullosos de servir a las familias trabajadoras del sur de Nevada.',
                missionTitle: 'Nuestra misión',
                missionText: 'Durante más de cuatro décadas, nuestra práctica ha combinado experiencia en tribunales con un enfoque práctico y compasivo. Explicamos sus opciones en lenguaje claro, respetamos su tiempo y presupuesto, y luchamos por resultados que mantengan unidas a las familias.',
                valuesItems: [
                    'Integridad y honorarios transparentes',
                    'Respeto por la historia de cada cliente',
                    'Conocimiento profundo del proceso migratorio federal',
                    'Raíces locales — Derecho UNLV, tribunales de Nevada y lazos comunitarios'
                ],
                communityTitle: 'Sirviendo a Las Vegas y Nevada',
                communityText: 'Desde el Strip hasta barrios suburbanos y condados rurales, entendemos la mezcla de culturas e industrias que hace fuerte a Nevada. Ya sea en hospitalidad, construcción, salud o su propio negocio, merece un equipo legal que escuche.',
                consultBtn: '📋 CONSULTA GRATUITA',
                whatWeDoBtn: 'Ver qué hacemos',
                footer: '© 2026 Grupo de Ley de Inmigración Justin Landess. Todos los derechos reservados.',
                footerDisclaimer: 'Publicidad de abogado. Resultados no garantizados.'
            }
        };

        function renderNav(t, active) {
            const links = [
                { href: 'index.html', key: 'navHome', id: 'home' },
                { href: 'about-us.html', key: 'navAbout', id: 'about' },
                { href: 'what-we-do.html', key: 'navWhatWeDo', id: 'what' },
                { href: 'tax-shelter.html', key: 'navTax', id: 'tax' }
            ];
            document.getElementById('siteNav').innerHTML = links.map(link => {
                const cls = link.id === active ? ' class="active"' : '';
                return `<a href="${link.href}"${cls}>${t[link.key]}</a>`;
            }).join('');
        }

        function setLanguage(language) {
            localStorage.setItem('preferredLanguage', language);
            const t = translations[language];
            document.documentElement.lang = language;
            document.title = t.pageTitle;
            renderNav(t, 'about');
            document.getElementById('pageHeading').textContent = t.pageHeading;
            document.getElementById('lead').textContent = t.lead;
            document.getElementById('photoGrid').innerHTML = PHOTOS.map(photo => `
                <figure class="photo-card">
                    <img src="${photo.src}" class="${photo.imgClass}" alt="${t[photo.captionKey]}" loading="lazy" width="600" height="400">
                    <figcaption>${t[photo.captionKey]}</figcaption>
                </figure>
            `).join('');
            document.getElementById('missionTitle').textContent = t.missionTitle;
            document.getElementById('missionText').textContent = t.missionText;
            document.getElementById('valuesList').innerHTML = t.valuesItems.map(item => `<li>${item}</li>`).join('');
            document.getElementById('communityTitle').textContent = t.communityTitle;
            document.getElementById('communityText').textContent = t.communityText;
            document.getElementById('consultBtn').textContent = t.consultBtn;
            document.getElementById('whatWeDoBtn').textContent = t.whatWeDoBtn;
            document.getElementById('footer').innerHTML = `<p>${t.footer}</p><p>${t.footerDisclaimer}</p>`;
            document.querySelectorAll('#lang-selector button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === language);
            });
        }

        function initLanguage() {
            const userLang = navigator.language || navigator.userLanguage;
            const lang = localStorage.getItem('preferredLanguage') || (userLang.startsWith('es') ? 'es' : 'en');
            setLanguage(lang);
        }

        window.addEventListener('DOMContentLoaded', initLanguage);
    </script>
</body>
</html>
